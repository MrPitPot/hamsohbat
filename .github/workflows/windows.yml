# Builds the Windows app (installer + portable zip) on a Windows runner, so it can be tested without a local toolchain.
# Run it from the Actions tab ("Run workflow"), then download the artifact. The server address is only the default;
# it can be changed inside the app (Settings) or with Hamsohbat.exe --server=https://...
name: Windows build
on:
  # Also builds when this branch is pushed (GitHub only offers the manual button for workflows on the default branch).
  push:
    branches: [claude/project-thread-i0yjr5]
    paths: ['.github/workflows/windows.yml', 'desktop/**', 'scripts/**', 'src/**', 'server/**', 'shared/**', 'package.json']
  workflow_dispatch:
    inputs:
      server:
        description: Default server address the app connects to (https://...)
        required: true
        default: https://hamsohbat.example.workers.dev
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: No two files may differ only by letter case (Windows and macOS would merge them)
        shell: bash
        run: |
          dup=$(git ls-files | tr 'A-Z' 'a-z' | sort | uniq -d)
          if [ -n "$dup" ]; then echo "Case-colliding files:"; echo "$dup"; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      # installer.wxs uses the WiX v4 schema; v7 needs an OSMF EULA acceptance, which is the owner's decision, so stay on v4.
      - name: Install WiX 4
        run: dotnet tool install --global wix --version 4.0.5
      - run: npm ci
      - run: node scripts/setup-desktop.mjs
      - name: Build (web app, desktop app, installer, bundles)
        env:
          HAMSOHBAT_SERVER: ${{ inputs.server || vars.HAMSOHBAT_SERVER || 'https://hamsohbat.example.workers.dev' }}
        run: node scripts/release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Hamsohbat-Windows
          path: |
            release/Hamsohbat-Setup.msi
            release/Hamsohbat-Portable.zip
            release/hamsohbat-server.zip
          if-no-files-found: error
