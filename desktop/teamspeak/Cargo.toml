[package]
name = "hs-teamspeak"
version = "1.0.0"
edition = "2021"
description = "TeamSpeak 3 bridge for the Hamsohbat desktop app: talks JSON over stdin/stdout."
license = "MIT OR Apache-2.0"

[[bin]]
name = "hs-teamspeak"
path = "src/main.rs"

[dependencies]
tsclientlib = { path = "../.deps/tsclientlib/tsclientlib" }
tsproto-packets = { path = "../.deps/tsclientlib/utils/tsproto-packets" }
audiopus = "0.3.0-rc.0"
cpal = "0.18"
anyhow = "1"
time = "0.3"
nnnoiseless = { version = "0.5", default-features = false }
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
tokio-stream = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
